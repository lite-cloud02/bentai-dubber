name: Copy videos to server 2

# Purani videos Server 1 se Server 2 par copy karta hai, ek-ek episode karke.
# Jo episode Server 2 par pehle se hai use chhod deta hai. Server 1 ka download limit khatam ho jaye
# to wahin ruk jata hai; baad mein (limit reset ke baad) dobara chalao, wo wahin se aage badhega.

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID to copy (leave EMPTY to copy ALL episodes)'
        required: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3B_KEY_ID: ${{ secrets.S3B_KEY_ID }}
      S3B_SECRET: ${{ secrets.S3B_SECRET }}
      S3B_REGION: ${{ secrets.S3B_REGION }}
      S3B_BUCKET: ${{ secrets.S3B_BUCKET }}
      S3B_ENDPOINT: ${{ secrets.S3B_ENDPOINT }}
      EP: ${{ inputs.episode_id }}
    steps:
      - name: Check server 2 secrets
        run: |
          if [ -z "${S3B_BUCKET:-}" ] || [ -z "${S3B_KEY_ID:-}" ] || [ -z "${S3B_SECRET:-}" ] || [ -z "${S3B_ENDPOINT:-}" ]; then
            echo "::error::Server 2 secrets are missing (S3B_KEY_ID, S3B_SECRET, S3B_BUCKET, S3B_ENDPOINT, S3B_REGION)"; exit 1
          fi
      - name: Work out server 2 region
        run: |
          R="${S3B_REGION:-}"
          if [ -z "$R" ]; then
            case "${S3B_ENDPOINT:-}" in
              s3.*) R="$(echo "$S3B_ENDPOINT" | sed -E 's/^s3\.([^.]+)\..*/\1/')" ;;
              *) R="auto" ;;
            esac
          fi
          echo "S3B_REGION_EFF=$R" >> "$GITHUB_ENV"
      - name: Copy episodes one by one
        run: |
          set -u
          S1() { aws "$@" --endpoint-url "https://$S3_ENDPOINT"; }
          S2() { AWS_ACCESS_KEY_ID="$S3B_KEY_ID" AWS_SECRET_ACCESS_KEY="$S3B_SECRET" AWS_DEFAULT_REGION="${S3B_REGION_EFF:-auto}" aws "$@" --endpoint-url "https://$S3B_ENDPOINT"; }

          if ! S2 s3api list-objects-v2 --bucket "$S3B_BUCKET" --max-items 1 >/dev/null 2>&1; then
            echo "::error::Cannot open the server 2 bucket. Check the S3B_* secrets (key, bucket name, endpoint)."; exit 1
          fi

          if [ -n "${EP:-}" ]; then
            IDS="$EP"
          else
            IDS="$(S1 s3 ls "s3://$S3_BUCKET/episodes/" | awk '$1=="PRE"{gsub("/","",$2); print $2}')"
          fi
          if [ -z "$IDS" ]; then echo "::error::No episodes found on server 1 (or cannot read it)."; exit 1; fi

          DONE=0; SKIP=0; FAIL=0
          for ID in $IDS; do
            if S2 s3 ls "s3://$S3B_BUCKET/episodes/$ID/index.m3u8" >/dev/null 2>&1; then
              echo "SKIP   $ID (already on server 2)"; SKIP=$((SKIP+1)); continue
            fi
            rm -rf work; mkdir -p "work/$ID"
            if ! S1 s3 sync "s3://$S3_BUCKET/episodes/$ID/" "work/$ID/" --only-show-errors; then
              echo "::warning::Could not download $ID. Server 1 download limit may be reached. Stopping here; run this workflow again later."
              FAIL=1; break
            fi
            if [ ! -f "work/$ID/index.m3u8" ]; then echo "::warning::$ID has no index.m3u8 on server 1, skipped"; continue; fi
            # pehle video ke tukde, phir aakhir mein playlist (taaki adhura upload kabhi 'poora' na dikhe)
            if S2 s3 sync "work/$ID/" "s3://$S3B_BUCKET/episodes/$ID/" --exclude "index.m3u8" --only-show-errors \
               && S2 s3 cp "work/$ID/index.m3u8" "s3://$S3B_BUCKET/episodes/$ID/index.m3u8" --only-show-errors; then
              echo "COPIED $ID"; DONE=$((DONE+1))
            else
              echo "::warning::Upload to server 2 failed for $ID"; FAIL=1
            fi
          done
          echo "================ Copied=$DONE  Skipped(already there)=$SKIP  Problems=$FAIL"
          if [ "$FAIL" != 0 ]; then exit 1; fi
