name: Encode episode

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID (from admin panel)'
        required: true
      source_key:
        description: 'File name uploaded in the bucket (e.g. mems.mp4)'
        required: true

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      KEY_SECRET: ${{ secrets.KEY_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
      PRESET: medium
      EP: ${{ inputs.episode_id }}
      SRC: ${{ inputs.source_key }}
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Download source from bucket
        run: aws s3 cp "s3://$S3_BUCKET/$SRC" input.mp4 --endpoint-url "https://$S3_ENDPOINT"
      - name: Encode (720p, encrypted HLS) and upload
        run: |
          set -euo pipefail
          SITE="${SITE_URL%/}"
          WORK="$(mktemp -d)"
          OUT="hls_out/$EP"
          mkdir -p "$OUT"
          printf '%s' "$EP" | openssl dgst -sha256 -hmac "$KEY_SECRET" -binary > "$WORK/full.bin"
          head -c 16 "$WORK/full.bin" > "$WORK/enc.key"
          printf '%s\n%s\n' "$SITE/api/key?e=$EP" "$WORK/enc.key" > "$WORK/keyinfo"
          ffmpeg -y -i input.mp4 -map 0:v:0 -map 0:a:0? \
            -vf "scale=-2:720" -c:v libx264 -profile:v high -preset "$PRESET" -crf 24 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -ac 2 \
            -hls_time 6 -hls_playlist_type vod -hls_key_info_file "$WORK/keyinfo" \
            -hls_segment_filename "$OUT/seg_%04d.ts" "$OUT/index.m3u8"
          aws s3 sync "$OUT" "s3://$S3_BUCKET/episodes/$EP" --endpoint-url "https://$S3_ENDPOINT" --delete
          echo "Upload done: episodes/$EP"
      - name: Delete source file
        run: aws s3 rm "s3://$S3_BUCKET/$SRC" --endpoint-url "https://$S3_ENDPOINT"
