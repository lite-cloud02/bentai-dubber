name: Encode episode v2

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID (from admin panel)'
        required: true
      source_key:
        description: 'File name uploaded in the bucket (e.g. mems.mp4)'
        required: true

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      # Server 2 (optional, jaise Cloudflare R2). Secrets khali hon to sirf server 1 par upload hoga.
      S3B_KEY_ID: ${{ secrets.S3B_KEY_ID }}
      S3B_SECRET: ${{ secrets.S3B_SECRET }}
      S3B_REGION: ${{ secrets.S3B_REGION }}
      S3B_BUCKET: ${{ secrets.S3B_BUCKET }}
      S3B_ENDPOINT: ${{ secrets.S3B_ENDPOINT }}
      KEY_SECRET: ${{ secrets.KEY_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
      PRESET: medium
      EP: ${{ inputs.episode_id }}
      SRC: ${{ inputs.source_key }}
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Work out server 2 region
        run: |
          R="${S3B_REGION:-}"
          if [ -z "$R" ]; then
            case "${S3B_ENDPOINT:-}" in
              s3.*) R="$(echo "$S3B_ENDPOINT" | sed -E 's/^s3\.([^.]+)\..*/\1/')" ;;
              *) R="auto" ;;
            esac
          fi
          echo "S3B_REGION_EFF=$R" >> "$GITHUB_ENV"
      - name: Download source from bucket
        run: |
          echo "Looking for file: [$SRC]"
          if aws s3 cp "s3://$S3_BUCKET/$SRC" input.mp4 --endpoint-url "https://$S3_ENDPOINT"; then
            echo "SRC_FROM=1" >> "$GITHUB_ENV"
          elif [ -n "${S3B_BUCKET:-}" ] && AWS_ACCESS_KEY_ID="$S3B_KEY_ID" AWS_SECRET_ACCESS_KEY="$S3B_SECRET" AWS_DEFAULT_REGION="${S3B_REGION_EFF:-auto}" aws s3 cp "s3://$S3B_BUCKET/$SRC" input.mp4 --endpoint-url "https://$S3B_ENDPOINT"; then
            echo "Source found on server 2"
            echo "SRC_FROM=2" >> "$GITHUB_ENV"
          else
            echo "::warning::Download failed. Asking server 1 for the real reason..."
            aws s3api get-object --bucket "$S3_BUCKET" --key "$SRC" --range bytes=0-0 /dev/null --endpoint-url "https://$S3_ENDPOINT" || true
            echo "---- Files found in server 1 bucket (root) ----"
            aws s3 ls "s3://$S3_BUCKET/" --endpoint-url "https://$S3_ENDPOINT" || true
            echo "::error::Could not download the source file from any server. See the reason printed above."
            exit 1
          fi
      - name: Encode (720p, encrypted HLS) and upload
        run: |
          set -euo pipefail
          SITE="${SITE_URL%/}"
          WORK="$(mktemp -d)"
          OUT="hls_out/$EP"
          mkdir -p "$OUT"
          printf '%s' "$EP" | openssl dgst -sha256 -hmac "$KEY_SECRET" -binary > "$WORK/full.bin"
          head -c 16 "$WORK/full.bin" > "$WORK/enc.key"
          printf '%s\n%s\n' "$SITE/api/key?e=$EP" "$WORK/enc.key" > "$WORK/keyinfo"
          ffmpeg -y -i input.mp4 -map 0:v:0 -map 0:a:0? \
            -vf "scale=-2:720" -c:v libx264 -profile:v high -preset "$PRESET" -crf 24 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -ac 2 \
            -hls_time 6 -hls_playlist_type vod -hls_key_info_file "$WORK/keyinfo" \
            -hls_segment_filename "$OUT/seg_%04d.ts" "$OUT/index.m3u8"
          OK1=0; OK2=0
          aws s3 sync "$OUT" "s3://$S3_BUCKET/episodes/$EP" --endpoint-url "https://$S3_ENDPOINT" --delete && OK1=1 || echo "::warning::Upload to server 1 FAILED"
          if [ -n "${S3B_BUCKET:-}" ]; then
            AWS_ACCESS_KEY_ID="$S3B_KEY_ID" AWS_SECRET_ACCESS_KEY="$S3B_SECRET" AWS_DEFAULT_REGION="${S3B_REGION_EFF:-auto}" \
              aws s3 sync "$OUT" "s3://$S3B_BUCKET/episodes/$EP" --endpoint-url "https://$S3B_ENDPOINT" --delete && OK2=1 || echo "::warning::Upload to server 2 FAILED"
          fi
          if [ "$OK1" = 0 ] && [ "$OK2" = 0 ]; then echo "::error::Upload failed on every server"; exit 1; fi
          echo "Upload done: episodes/$EP (server1=$OK1 server2=$OK2)"
      - name: Delete source file
        run: |
          if [ "${SRC_FROM:-1}" = "2" ]; then
            AWS_ACCESS_KEY_ID="$S3B_KEY_ID" AWS_SECRET_ACCESS_KEY="$S3B_SECRET" AWS_DEFAULT_REGION="${S3B_REGION_EFF:-auto}" aws s3 rm "s3://$S3B_BUCKET/$SRC" --endpoint-url "https://$S3B_ENDPOINT" || echo "::warning::Could not delete the source file"
          else
            aws s3 rm "s3://$S3_BUCKET/$SRC" --endpoint-url "https://$S3_ENDPOINT" || echo "::warning::Could not delete the source file"
          fi
